{% extends "base.html" %}

{% block title %}Iniciar sesión — Plataforma Q&amp;A{% endblock %}

{% block content %}
<section>
    <h1>Iniciar sesión</h1>
    <form action="{{ url_for('auth.login') }}" method="post">
        <div>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" maxlength="120" required autocomplete="email">
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit">Iniciar sesión</button>
    </form>
    <p>¿Todavía no tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a>.</p>
</section>
{% endblock %}
