[project]
name = "proyectoisi2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ValettiSW", email = "valettigabriel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "google-genai>=3.6.1",
    "openai>=3.58.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
proyectoisi2026 = "proyectoisi2026:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.build-backend]
module-name = "qa_app"
